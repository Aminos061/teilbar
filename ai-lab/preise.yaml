# API-Listenpreise für den Schattenpreis (D07, D24), USD pro 1 Mio. Tokens.
# Quelle: LiteLLM model_prices_and_context_window.json (dieselbe Quelle wie AgentsView),
# abgerufen am 2026-10-30: https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
# Neue Modelle: Zeile ergänzen, Quelle und Datum im Commit nennen. Alte Preise nicht überschreiben,
# sondern mit neuem "valid_from" darunter eintragen, damit alte Sitzungen gleich bewertet bleiben.

stand: 2026-10-30
models:
  claude-opus-5-5:   { input: 4.00,  output: 20.00, cache_read: 0.20,  cache_write: 5.00 }
  claude-sonnet-5-5: { input: 2.00,  output: 10.00, cache_read: 0.10,  cache_write: 2.50 }
  claude-haiku-5-5:  { input: 0.10,  output: 0.50,  cache_read: 0.01,  cache_write: 0.125 }
  claude-fable-5-1:  { input: 10.00, output: 50.00, cache_read: 0.25,  cache_write: 12.50 }
  gpt-5.3-codex:     { input: 1.75,  output: 14.00, cache_read: 0.175, cache_write: null }
  gpt-5.5:           { input: 5.00,  output: 30.00, cache_read: 0.50,  cache_write: null }
  gpt-5.6:           { input: 4.00,  output: 20.00, cache_read: 0.40,  cache_write: 5.00 }
  gpt-6-sol:         { input: 2.00,  output: 10.00, cache_read: 0.20,  cache_write: 2.50 }
  gpt-6-astra:       { input: 10.00, output: 50.00, cache_read: 1.00,  cache_write: 12.50 }
  gemini-3.1-pro-preview: { input: 2.00, output: 12.00, cache_read: 0.20, cache_write: null }
  gemini-3.5-flash:  { input: 1.50,  output: 9.00,  cache_read: 0.15,  cache_write: null }
  # Uni-Qwen über den LiteLLM-Proxy der Hochschule: für uns kostenlos.
  qwen3.8:27b:          { input: 0, output: 0, cache_read: 0, cache_write: 0 }
  qwen3.8:27b-academic: { input: 0, output: 0, cache_read: 0, cache_write: 0 }

# Copilot Student wählt das Modell automatisch und rechnet in "AI Credits" ab; dafür gibt es
# keinen Tokenpreis. Copilot-Sitzungen bekommen tokens.source = unbekannt, wenn das Modell
