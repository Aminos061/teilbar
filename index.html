<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teilbar · Prototyp</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2) format('woff2')}
:root{
  --deep:#1B6B3A; --green:#2E9E5B; --leaf:#3DB36E; --mint:#5CC98A;
  --yellow:#FFC83D; --card:#F2F9F4; --ink:#15291C; --muted:#5B6B60; --pale:#D9EFE0;
  --line:#E2EEE6; --tier:#E8732A; --wohnung:#3B7DD8; --red:#C8483A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--deep);color:var(--ink);margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:780px;height:880px;display:flex;gap:46px;align-items:center;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Demo-Steuerung neben dem Phone */
.ctrl{width:320px;height:868px;color:var(--pale);display:flex;flex-direction:column;justify-content:center;gap:14px;flex:none}
.ctrl h1{display:flex;align-items:center;gap:12px;color:#fff;font-size:30px;font-weight:800;letter-spacing:-.5px}
.ctrl h1 svg{width:44px;height:44px}
.ctrl .tag{color:var(--yellow);font-style:italic;font-size:17px;margin-top:-10px}
.ctrl label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles button{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;text-align:left;font-size:15px;font-weight:600;color:#fff;display:flex;gap:10px;align-items:center}
.roles button small{display:block;font-weight:400;font-size:12px;color:var(--pale)}
.roles button.on{background:var(--yellow);color:var(--ink)}
.roles button.on small{color:var(--ink)}
.cbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;text-align:left}
.cbtn:hover{background:rgba(255,255,255,.2)}
.hint{background:rgba(0,0,0,.18);border-radius:14px;padding:14px;font-size:15px;line-height:1.45;color:#fff}
.hint b{color:var(--yellow)}
.daypill{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}
.uc{display:flex;flex-direction:column;gap:2px}
.uc h4.fold{cursor:pointer;opacity:.75;margin:0;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.uc h4.fold:hover{opacity:1}
.uc h4 em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--mint)}
.cap{display:none}
.guide{display:none}
.guide .gtop{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mint)}
.guide .gtop em{margin-left:auto;font-style:normal;color:var(--pale);font-weight:600}
.guide .gcap{font-size:19px;line-height:1.25;font-weight:800;color:#fff;margin:6px 0 10px;text-wrap:balance}
.guide .gbtns{display:flex;gap:8px}
.guide .gbtns button{flex:1;min-height:44px;border-radius:12px;font-weight:700;font-size:16px;background:rgba(255,255,255,.14);color:#fff}
.guide .gbtns button.next{flex:2;background:var(--yellow);color:var(--ink)}
.guide .gbtns button:disabled{opacity:.35}
body.beamer .stage{width:1000px}
body.beamer .ctrl{width:540px}
body.beamer #steps,body.beamer .viewas,body.beamer .tag{display:none}
body.beamer .cap{display:flex;flex-direction:column;gap:18px;background:rgba(0,0,0,.16);border-radius:24px;padding:28px}
.cap .uct{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--mint)}
.cap .uct em{margin-left:auto;font-style:normal;color:var(--pale);font-weight:600}
.cap .big{font-size:46px;line-height:1.12;font-weight:800;color:#fff;letter-spacing:-.5px;text-wrap:balance}
.cap .big b{color:var(--yellow)}
.cap .who{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:#fff}
.cap .who .av{width:58px;height:58px;font-size:24px}
.cap .dots{display:flex;gap:6px}
.cap .dots i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.2)}
.cap .dots i.on{background:var(--yellow)}
body.beamer{--muted:#3A4A40;--line:#C2D6C9}
body.beamer .meta,body.beamer p.sub{font-size:16px}
body.beamer h3{font-size:15px}
body.beamer .field small,body.beamer .steplabels{font-size:13.5px}
body.beamer .tabs button{font-size:14px}
body.beamer .lvl,body.beamer .kind,body.beamer .pill{font-size:14px}
body.beamer .m.sys,body.beamer .check small,body.beamer p.flag{font-size:15px}
body.beamer .card.white,body.beamer .field,body.beamer .chip,body.beamer .seg button{border-color:#B7CFBF}
.keys{font-size:12.5px;color:var(--mint);text-align:center}
.keys kbd{display:inline-block;border:1.5px solid rgba(255,255,255,.35);border-radius:6px;padding:0 6px;margin:0 2px;color:#fff;font:inherit;font-weight:700}
.uc h4{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:700;margin:0 0 6px}
.uc h4 span{font-size:18px}
.st{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-align:left;color:var(--pale);font-size:14.5px;font-weight:500;width:100%}
.st:hover{background:rgba(255,255,255,.08)}
.st .n{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,.35);color:#fff}
.st .who{width:22px;height:22px;border-radius:50%;flex:none;margin-left:auto;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.st.done{color:rgba(217,239,224,.6)}
.st.done .n{background:var(--green);border-color:var(--green)}
.st.now{background:var(--yellow);color:var(--ink);font-weight:700}
.st.now .n{border-color:var(--ink);color:var(--ink)}
.ctrlrow{display:flex;gap:8px}
.ctrlrow .cbtn{flex:1;text-align:center;padding:10px 8px;font-size:14px}
.cbtn:disabled{opacity:.35;cursor:default}
.viewas{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--pale)}
.viewas button{opacity:.45}
.viewas button.on{opacity:1;outline:2px solid var(--yellow);outline-offset:2px;border-radius:50%}

/* Phone */
.phone{width:414px;height:868px;border-radius:52px;background:#0F1F15;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);flex:none}
.screen{width:390px;height:844px;border-radius:40px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0F1F15;border-radius:20px}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px}
.view::-webkit-scrollbar{display:none}
.tabs{flex:none;height:78px;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 18px;background:#fff}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);width:76px;position:relative}
.tabs button .ic{font-size:22px;line-height:26px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--deep)}
.tabs button.on .ic{filter:none;opacity:1}
.tabs .dot{position:absolute;top:-2px;right:16px;background:var(--red);color:#fff;font-size:11px;border-radius:99px;min-width:18px;height:18px;line-height:18px;text-align:center}

/* Bausteine */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top svg{width:34px;height:34px;flex:none}
.top .brand{font-weight:800;font-size:22px;color:var(--deep);letter-spacing:-.3px}
.top .where{margin-left:auto;font-size:13px;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:99px;font-weight:600}
.back{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:var(--deep);padding:8px 0 12px}
h2{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-bottom:6px}
h3{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
p.sub{color:var(--muted);font-size:16px;line-height:1.4}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card.white{background:#fff;border:1.5px solid var(--line)}
.card.tap{cursor:pointer;transition:transform .1s}
.card.tap:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:72px;height:72px;font-size:28px}
.name{font-weight:700;font-size:17px}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.kind.tier{background:#FDEBDD;color:#B4531A}
.kind.wohnung{background:#E2ECFA;color:#2A5FAD}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--pale);color:var(--deep)}
.pill.y{background:#FFF1C9;color:#7A5A00}
.pill.g{background:var(--green);color:#fff}
.lvl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--deep);background:#fff;border:1.5px solid var(--pale);border-radius:99px;padding:2px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-weight:700;font-size:18px;background:var(--deep);color:#fff;margin-top:10px}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.o{background:#fff;color:var(--deep);border:2px solid var(--pale)}
.btn.sm{min-height:44px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;background:#fff}
.chip.on{border-color:var(--green);background:#E7F6EC;color:var(--deep)}
.seg{display:grid;gap:8px}
.seg button{border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;background:#fff}
.seg button.on{border-color:var(--green);background:#E7F6EC}
.seg b{font-size:16px;display:block}
.seg small{font-size:13px;color:var(--muted)}
.seg .n{margin-left:auto;font-weight:700;color:var(--deep);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field small{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.field span{font-size:16px;font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.check:last-child{border:0}
.box{width:28px;height:28px;border-radius:8px;border:2.5px solid #B8CFC0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .t{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:13px;margin-top:2px;text-decoration:none}
.hero{background:var(--deep);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero h2{color:#fff}
.hero p{color:var(--pale);font-size:16px;line-height:1.4}
.hero:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-60px;height:90px;border-radius:50%;background:var(--green);opacity:.7}
.hero > *{position:relative;z-index:1}
.faces{display:flex;margin:6px 0}
.faces .av{border:3px solid #fff;margin-right:-10px}
.stat{display:flex;gap:8px;margin-top:10px}
.stat div{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--deep)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.banner{background:#FFF1C9;border-radius:16px;padding:14px;margin-bottom:12px;font-size:15px;line-height:1.4}
.banner b{display:block;font-size:16px;margin-bottom:2px}
.prog{height:10px;background:var(--pale);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.steps{display:flex;gap:4px;margin:10px 0 2px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--pale)}
.steps i.on{background:var(--green)}
.steplabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}

/* Chat */
.chathead{display:flex;align-items:center;gap:10px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin:0 -20px;padding-left:20px;padding-right:20px}
.ctx{margin:10px 0;background:var(--card);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.m{max-width:80%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.35}
.m.me{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.m.sys{align-self:center;background:none;color:var(--muted);font-size:13px;font-weight:600;text-align:center;max-width:95%;padding:4px}
.m.sys b{color:var(--deep)}
.m.photo{padding:6px;background:var(--card)}
.m.photo .img{width:200px;height:150px;border-radius:14px;background:linear-gradient(160deg,#FFE7A6,#FFC83D);display:flex;align-items:center;justify-content:center;font-size:76px}
.m.card2{background:#fff;border:2px solid var(--pale);align-self:center;max-width:100%;width:100%}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.quick button{background:#fff;border:2px solid var(--green);color:var(--deep);border-radius:99px;padding:10px 16px;font-weight:700;font-size:16px}
.input{display:flex;gap:8px;align-items:center;margin-top:6px}
.input input{flex:1;min-width:0;border:2px solid var(--line);border-radius:99px;padding:12px 16px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.input input:focus{border-color:var(--green)}
.input button{width:48px;height:48px;border-radius:50%;background:var(--deep);color:#fff;font-size:20px}
.flag{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

/* Sheet + Toast */
.sheet{position:absolute;inset:0;background:rgba(21,41,28,.45);display:flex;align-items:flex-end;z-index:5}
.sheet .in{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:20px 20px 30px;max-height:85%;overflow:auto}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:600;z-index:6;animation:t 3.2s forwards}
@keyframes t{0%{opacity:0;transform:translateY(10px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}

/* Screenshot-Modus: nur der Bildschirm */
body.bare{background:#fff;padding:0;display:block}
body.bare .stage{position:static;transform:none;width:auto;height:auto;display:block}
body.bare .ctrl{display:none}
body.bare .phone{width:390px;height:844px;border-radius:0;padding:0;box-shadow:none;background:none}
body.bare .screen{border-radius:0}
body.bare .notch{display:none}
body.bare .toast{display:none}
body.bare .guide{display:none !important}
@media (max-width:500px){
  body{padding:0;gap:0;display:block;background:var(--deep);overflow:auto}
  .stage{position:static;transform:none;width:auto;height:auto;display:flex;flex-direction:column;gap:0}
  .ctrl{height:auto;order:3}
  .guide{display:block;order:0;padding:14px 16px 10px}
  .phone{order:1}
  .keys{display:none}
  .phone{width:100vw;height:calc(100dvh - 150px);border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{width:100%;height:100%;border-radius:0}
  .notch,.status{display:none}
  .ctrl{width:100%;padding:20px 16px 40px}
}

/* ---------- UI-Schicht v2: Icons, Tiefe, Bewegung ---------- */
:root{--shadow:0 1px 2px rgba(21,41,28,.06),0 8px 24px -10px rgba(21,41,28,.18);--shadow-lg:0 2px 4px rgba(21,41,28,.06),0 18px 40px -14px rgba(21,41,28,.28);--ease:cubic-bezier(.2,.8,.2,1)}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{background:#FAFCFA}
.view.enter{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Kopfzeile bleibt beim Scrollen stehen */
.top{position:sticky;top:0;z-index:4;margin:0 -20px 4px;padding:8px 20px 12px;background:rgba(250,252,250,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.top .where{background:#fff;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:4px}
h2{letter-spacing:-.6px}
h3{font-size:12px;letter-spacing:.09em}
/* Karten: Tiefe statt Rahmen */
.card{border-radius:20px}
.card.white,.seg button,.field{border:1px solid rgba(21,41,28,.06);box-shadow:var(--shadow);background:#fff}
.card.tap,.banner.tap{transition:transform .18s var(--ease),box-shadow .18s var(--ease);cursor:pointer}
.card.tap:hover,.banner.tap:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.tap:active{transform:scale(.985)}
.hero{box-shadow:0 18px 40px -18px rgba(27,107,58,.7)}
.stat div{box-shadow:var(--shadow)}
.banner{display:block;border-radius:18px;box-shadow:var(--shadow)}
.banner b .i{color:var(--deep)}
/* Buttons */
.btn{gap:10px;border-radius:18px;transition:transform .12s var(--ease),box-shadow .2s var(--ease),filter .2s;box-shadow:0 10px 22px -12px rgba(27,107,58,.9)}
.btn.y{box-shadow:0 10px 22px -10px rgba(224,160,20,.85)}
.btn.o{box-shadow:var(--shadow);border:1px solid rgba(21,41,28,.08)}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.97)}
.btn .i{width:1.25em;height:1.25em}
.back{display:flex;width:max-content;align-items:center;gap:2px;font-size:15px;padding:6px 0 12px}
.back .i{width:20px;height:20px}
/* Chips und Labels */
.chip{border-radius:999px;padding:9px 14px;border:1.5px solid #DCE8E0;transition:all .15s var(--ease)}
.chip.on{border-color:var(--green);background:#E3F4E9;box-shadow:inset 0 0 0 1px var(--green)}
.chip .i{width:15px;height:15px;vertical-align:-3px}
.kind .i,.pill .i,.lvl .i{width:14px;height:14px;vertical-align:-2px}
.kind{gap:6px;padding:5px 11px}
.seg button{border-radius:16px;transition:all .15s var(--ease)}
.seg button.on{border-color:var(--green);background:#EAF7EF;box-shadow:inset 0 0 0 1.5px var(--green),var(--shadow)}
.seg b .i{color:var(--deep);margin-right:4px}
.box{border-radius:9px;transition:all .15s var(--ease)}
.box .i{width:17px;height:17px;stroke-width:3}
.check{transition:background .15s}
/* Avatare */
.av{font-size:16px}
.faces .av{box-shadow:0 0 0 3px #fff !important;margin-right:-8px}
/* Tab-Leiste mit Pill */
.tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(21,41,28,.06)}
.tabs button .ic{display:flex;align-items:center;justify-content:center;width:58px;height:30px;border-radius:999px;filter:none;opacity:1;color:#7C8C82;transition:all .2s var(--ease)}
.tabs button .ic .i{width:22px;height:22px}
.tabs button.on .ic{background:#DDF1E4;color:var(--deep)}
.tabs button.on{color:var(--deep)}
.tabs .dot{top:-4px;right:12px;box-shadow:0 0 0 2px #fff}
/* Chat */
.chathead{position:sticky;top:0;z-index:4;background:rgba(250,252,250,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chathead .back{padding:0 4px 0 0}
.ctx{box-shadow:var(--shadow);background:#fff}
.ctx .i{color:var(--tier);width:20px;height:20px}
.m{box-shadow:0 1px 1px rgba(21,41,28,.05)}
.m.them{background:#fff;border:1px solid rgba(21,41,28,.06)}
.m.me{background:linear-gradient(160deg,#23824A,var(--deep))}
.m.sys .i{width:14px;height:14px;vertical-align:-2px}
.m.card2{box-shadow:var(--shadow);border:0}
.m.photo{background:#fff;border:1px solid rgba(21,41,28,.06)}
.quick button{border-width:1.5px;transition:all .15s var(--ease);background:#fff}
.quick button:hover{background:#EAF7EF}
.quick button:active{transform:scale(.96)}
.input input{border:1.5px solid #DCE8E0;background:#fff}
.input button{display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(27,107,58,.9)}
.input button .i{width:20px;height:20px;margin-left:-2px}
/* Sheet und Toast */
.sheet{animation:fadeIn .2s ease}
.sheet .in{animation:sheetUp .32s var(--ease);box-shadow:0 -10px 40px rgba(21,41,28,.2)}
.sheet .in .name .i{color:var(--red)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes fadeIn{from{opacity:0}}
.toast{display:flex;gap:10px;align-items:center;border-radius:18px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);background:rgba(21,41,28,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.toast .i{color:var(--mint);width:20px;height:20px}
/* Demo-Steuerung */
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.cbtn .i{width:16px;height:16px}
.ctrlrow .cbtn{white-space:nowrap;font-size:13.5px;padding:10px 6px}
.st .n .i{width:13px;height:13px;stroke-width:3}
.uc h4 .i{width:18px;height:18px;color:var(--yellow)}
.cap .uct .i{width:24px;height:24px;color:var(--yellow)}
.guide .gtop .i{color:var(--yellow)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

/* UI emoji become line icons; emoji that people type in chats stay */

  S.chat.forEach(m=>{
    if (m.sys) h += `<div class="m sys">${m.t}</div>`;
    else if (m.meet) h += `<div class="m card2"><div class="name" style="font-size:16px">🤝 Kennenlern-Treffen</div><div class="meta">Sa, 26. Juli · 10:00 · bei Sarah, 2. OG links</div><button class="btn sm" data-go="treffen">Sitting-Vereinbarung öffnen</button></div>`;
    else if (m.photo) h += `<div class="m photo ${m.from===S.role?'me':'them'}" style="align-self:${m.from===S.role?'flex-end':'flex-start'}"><div class="img" style="background:url(img/minka.jpg) center/cover"></div><div style="padding:6px 6px 2px;font-size:14px">${m.t}</div></div>`;
    else h += `<div class="m ${m.from===S.role?'me':'them'}">${m.t}</div>`;
  });
  h += `</div>`;
  const q = quickReplies();
  if (q.length) h += `<div class="quick">${q.map(([t,a])=>`<button data-act="${a}">${t}</button>`).join('')}</div>`;
  h += `<div class="input"><input id="msg" placeholder="Nachricht schreiben …" autocomplete="off"><button data-act="send">➤</button></div>`;
  return h;
};
function quickReplies(){
  const r = S.req.status, me = S.role;
  if (r==='angebot' && me==='sarah') return [['Lena auswählen ✓','choose']];
  if (r==='zugesagt' && me==='sarah' && !S.chat.some(m=>m.meet)) return [['Treffen vorschlagen: Sa 10 Uhr','meet']];
  if (r==='zugesagt' && me==='lena' && S.chat.some(m=>m.meet) && !S.chat.some(m=>m.t==='Passt mir 👍')) return [['Passt mir 👍','ok'],['Anderer Termin?','alt']];
  if (r==='laeuft' && me==='lena') return [['📷 Foto von Minka','photo'],['Alles gut hier','allgood']];
  if (r==='laeuft' && me==='sarah') return [['Danke dir! 💚','thanks']];
  return [];
}

    ${[['🤒 Tier krank oder verletzt','Tierarzt Dr. Kern anrufen 📞'],['🔍 Tier entlaufen','Haus absuchen, Nachbarn fragen'],['💧 Wasserschaden','Haupthahn im Bad zudrehen'],['🔑 Schlüssel verloren','Notfallkontakt David anrufen'],['📵 Sarah nicht erreichbar','Bruder David anrufen']].map(([a,b])=>`<div class="card" style="margin-top:10px"><div class="name" style="font-size:16px">${a}</div><div class="meta" style="margin-top:4px;line-height:1.45">${b}</div></div>`).join('')}
    <button class="btn" data-act="close">Schließen</button></div></div>`;
  if (S.sheet==='report') return `<div class="sheet" data-act="close"><div class="in"><h2>Melden oder blockieren</h2><p class="sub">Vertraulich.</p><div class="seg" style="margin-top:12px"><button data-act="reported">Unangemessene Nachricht</button><button data-act="reported">Fake-Profil</button><button data-act="reported">Etwas anderes</button></div><button class="btn o" data-act="blocked">Blockieren</button><button class="btn" data-act="close">Abbrechen</button></div></div>`;

const TABS = [['start','🏠','Start'],['nachbarn','👥','Nachbarn'],['chats','💬','Chats'],['profil','👤','Profil']];
function render(){
  if (!V[S.screen]) S.screen='start';
  const vw = document.getElementById('view'); vw.innerHTML = X(V[S.screen]());
  if (S.screen !== render.last) { vw.classList.remove('enter'); void vw.offsetWidth; vw.classList.add('enter'); render.last = S.screen; }
  const tabOf = {start:'start',neu:'start',myreq:'start',detail:'start',fiete:'start',sitting:'start',status:'start',abschluss:'start',treffen:'chats',chat:'chats',kchat:'chats',nachbarn:'nachbarn',chats:'chats',profil:'profil'}[S.screen];
  const unread = (S.role==='sarah'&&S.req&&S.req.status==='angebot')||(S.role==='jonas'&&S.karl==='angebot');
  document.getElementById('tabs').style.display = S.screen==='ob' ? 'none' : '';
  document.getElementById('tabs').innerHTML = X(TABS.map(([k,i,l])=>`<button class="${tabOf===k?'on':''}" data-tab="${k}"><span class="ic">${i}</span>${l}${k==='chats'&&unread?'<span class="dot">1</span>':''}</button>`).join(''));
  let ov = sheet();
  if (S.toast) { ov += `<div class="toast">${S.toast}</div>`; S.toast=null; }
  document.getElementById('overlay').innerHTML = X(ov);
  document.getElementById('roles').innerHTML = 'Ansicht:' + Object.entries(P).map(([k,p])=>`<button class="${S.role===k?'on':''}" data-role="${k}" title="${p.n}">${av(p,'sm')}</button>`).join('');
  const canDay = S.req && (S.req.status==='kennengelernt' || (S.req.status==='laeuft' && S.day<10));
  const db = document.getElementById('daybtn'); db.disabled = !canDay; db.innerHTML = X(S.req&&S.req.status==='laeuft' ? `⏩ Tag ${S.day} → ${Math.min(10,S.day+(S.day<3?1:3))}` : '⏩ Vorspulen');
  document.getElementById('steps').innerHTML = X(UC.map(u=>{
    const cur = u.steps.findIndex(x=>!x.done(S));
    const nd = u.steps.filter(x=>x.done(S)).length;
    if (u.id!==S.uc) return `<div class="uc"><h4 class="fold" data-step="${u.id}:${Math.max(0,cur)}"><span>${u.icon}</span>${u.title}<em>${nd===u.steps.length?'✓ fertig':nd+' / '+u.steps.length}</em></h4></div>`;
    return `<div class="uc"><h4><span>${u.icon}</span>${u.title}<em>${nd} / ${u.steps.length}</em></h4>${u.steps.map((x,i)=>{
      const w = P[typeof x.who==='function'?x.who(S):x.who];
      const cls = x.done(S)?'done':(i===cur&&S.uc===u.id?'now':'');
      return `<button class="st ${cls}" data-step="${u.id}:${i}"><span class="n">${x.done(S)?'✓':i+1}</span>${x.l}<span class="who" style="background:${w.c}${w.img?` url(${w.img}) center/cover`:""}">${w.img?"":w.i}</span></button>`;
    }).join('')}</div>`;
  }).join(''));
  const au = UC.find(u=>u.id===S.uc), ci = au.steps.findIndex(x=>!x.done(S)), cs = ci<0 ? null : au.steps[ci];
  const cw = cs ? P[typeof cs.who==='function'?cs.who(S):cs.who] : null;
  document.getElementById('cap').innerHTML = X(`<div class="uct"><span>${au.icon}</span>${au.title.replace(' (Karl)','')}<em>${ci<0?'fertig':'Schritt '+(ci+1)+' von '+au.steps.length}</em></div>
    <div class="dots">${au.steps.map((x,i)=>`<i class="${x.done(S)||i===ci?'on':''}"></i>`).join('')}</div>
    <div class="big">${cs ? cs.c : '✓ Ablauf abgeschlossen.'}</div>
    ${cw ? `<div class="who">${av(cw)}${cw.n}</div>` : ''}`);
  const flatAll = UC.flatMap(u=>u.steps.map((_,i)=>[u.id,i])), gk = flatAll.findIndex(([u,i])=>u===S.uc && i===(ci<0?au.steps.length-1:ci));
  document.getElementById('guide').innerHTML = X(`<div class="gtop"><span>${au.icon}</span>${au.title.replace(' (Karl)','')}<em>${ci<0?'fertig':(ci+1)+' / '+au.steps.length}</em></div>
    <div class="gcap">${cs ? cs.c : '✓ Fertig. Weiter mit dem nächsten Ablauf.'}</div>
    <div class="gbtns"><button data-act="nav" data-v="-1" ${gk<=0&&ci<=0?'disabled':''}>‹ Zurück</button><button class="next" data-act="nav" data-v="1">${cs ? (cw ? 'Zeig mir das als '+cw.s : 'Weiter') : 'Weiter ›'}</button></div>`);
  document.getElementById('beambtn').innerHTML = X(document.body.classList.contains('beamer') ? '📽 Beamer aus' : '📽 Beamer');
  document.getElementById('view').scrollTop = 0;
}
const OFFER = () => [{sys:1,t:'<b>Lena</b> hat „Kann ich übernehmen“ getippt'},{from:'lena',t:'Hi Sarah! Ich wohne zwei Stockwerke über dir und kann gern auf Minka aufpassen 🙂'}];

    {l:'Aufgaben, Katzenfoto', c:'Lena hakt Aufgaben ab und schickt ein Foto.', who:'lena', go:'sitting', done:s=>s.photo||st2(s)>=5, pre:s=>{s.req={status:'laeuft'};s.day=1;s.chat=KEYED();s.meet={sarah:true,lena:true,vers:true,key:true};}},

  ]},
  {id:'ob', icon:'🪪', title:'Anmelden (Karl)', steps:[

const KCHAT = () => [{sys:1,t:'<b>Karl</b> hat „Kann ich übernehmen“ getippt'},{from:'karl',t:'Guten Tag, ich bin Karl aus Nr. 7. Bruno kommt gern mit.'},{from:'jonas',t:'Toll! Morgen um 17 Uhr an der Haustür?'}];
function st2(s){ return s.req ? STEPS.indexOf(s.req.status) : -1; }
function gotoStep(uid, i){
  const u = UC.find(x=>x.id===uid), x = u.steps[i];
  const cur = u.steps.findIndex(y=>!y.done(S));
  if (i !== cur || S.uc !== uid) {
    const keep = uid==='ob' ? JSON.parse(JSON.stringify(S)) : uid==='sit' ? {karl:S.karl,kchat:S.kchat,ob:S.ob,code:S.code} : {req:S.req,chat:S.chat,day:S.day,done:S.done,photo:S.photo,meet:S.meet,end:S.end,ob:S.ob,code:S.code};
    S = Object.assign(fresh(), keep); x.pre(S);
  }
  if (innerWidth<=500) scrollTo({top:0,behavior:'smooth'});
  S.uc = uid; S.cursor = i; S.role = typeof x.who==='function' ? x.who(S) : x.who; S.screen = x.go; S.sheet = null;
  render();
}
function sys(t){ S.chat.push({sys:1,t}); }
function setStatus(s){ S.req.status=s; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],[data-tab],[data-role],[data-step]');
  if (!el) return;
  if (el.dataset.step){ const [u,i]=el.dataset.step.split(':'); return gotoStep(u,+i); }
  if (el.dataset.role){ S.role=el.dataset.role; S.screen='start'; S.sheet=null; return render(); }
  if (el.dataset.tab){ S.screen=el.dataset.tab; return render(); }
  if (el.dataset.go){ S.screen=el.dataset.go; return render(); }
  const a = el.dataset.act, v = el.dataset.v;
  if (a==='close' && el.classList.contains('sheet') && e.target!==el) return;
  switch(a){
    case 'kind': S.form.kind = v; break;
    case 'task': { const i=+v, t=S.form.tasks; t.includes(i)?t.splice(t.indexOf(i),1):t.push(i); break; }
    case 'kreis': S.form.kreis = v; break;
    case 'post': S.req={status:'offen'}; S.screen='start'; toast('✓ Anfrage ist sichtbar für 6 Nachbarn in deinem Haus'); break;
    case 'offer': setStatus('angebot'); S.chat=[{sys:1,t:'<b>Lena</b> hat „Kann ich übernehmen“ getippt'},{from:'lena',t:'Hi Sarah! Ich wohne zwei Stockwerke über dir und mag Katzen sehr. Ich kann gern auf Minka aufpassen 🙂'}]; S.screen='chat'; break;
    case 'choose': setStatus('zugesagt'); sys('<b>Sarah hat Lena ausgewählt</b> · Adresse freigegeben: Lindenstr. 12, 2. OG links'); S.chat.push({from:'sarah',t:'Wie schön, danke dir! Lass uns vorher kurz kennenlernen.'}); S.screen='chat'; break;
    case 'meet': S.chat.push({meet:1}); S.chat.push({from:'sarah',t:'Passt dir Samstag um 10 bei mir? Dann zeige ich dir alles.'}); break;
    case 'ok': S.chat.push({from:'lena',t:'Passt mir 👍'}); sys('<b>Treffen am Sa um 10 Uhr bestätigt</b>'); break;
    case 'mt': S.meet[v]=!S.meet[v]; break;
    case 'key': S.meet.key=true; setStatus('kennengelernt'); sys('🔑 <b>Schlüssel übergeben</b> · beide bestätigt'); toast('✓ Ihr kennt euch jetzt persönlich'); break;
    case 'day':
      if (S.req && S.req.status==='kennengelernt'){ setStatus('laeuft'); S.day=1; sys('▶ <b>Sitting läuft</b> · Tag 1 von 10'); toast('Sarah ist im Urlaub. Das Sitting läuft.'); if(S.role==='lena') S.screen='sitting'; }
      else if (S.req && S.req.status==='laeuft' && S.day<10){ S.day=Math.min(10,S.day+ (S.day<3?1:3)); toast('Tag '+S.day+' von 10'); }
      else if (S.karl==='haus' && S.req && S.req.status==='abgeschlossen'){ toast('24 Stunden später …'); }
      else toast('Gerade gibt es nichts vorzuspulen');
      break;
    case 'done': S.done[v]=!S.done[v]; break;
    case 'photo': S.photo=true; S.chat.push({from:'lena',photo:1,t:'Minka hat heute auf dem Balkon geschlafen ☀️'}); break;
    case 'allgood': S.chat.push({from:'lena',t:'Alles gut hier 🙂'}); break;
    case 'thanks': S.chat.push({from:'sarah',t:'Danke dir! 💚'}); break;
    case 'sos': S.sheet='sos'; break;
    case 'report': S.sheet='report'; break;
    case 'close': S.sheet=null; break;
    case 'endkey': S.end.key=!S.end.key; break;
    case 'rec': S.end[S.role==='sarah'?'recS':'recL']=true; if(S.end.recS&&S.end.recL&&S.req.status!=='abgeschlossen'){ setStatus('abgeschlossen'); sys('✓ <b>Sitting abgeschlossen</b> · Schlüssel zurück'); S.uc='str'; } break;
    case 'send': { const f=document.getElementById('msg'), v2=f&&f.value.trim(); if(!v2) return; (S.screen==='kchat'?S.kchat:S.chat).push({from:S.role,t:v2.replace(/</g,'&lt;')}); break; }
    case 'alt': S.chat.push({from:'lena',t:'Geht auch Sonntag?'}); break;
    case 'karlwhen': S.kchat.push({from:'karl',t:'Wann darf ich vorbeikommen?'}); break;
    case 'reported': S.sheet=null; toast('✓ Danke. Die Meldung geht vertraulich an das Team.'); break;
    case 'blocked': S.sheet=null; toast('✓ Blockiert. Ihr seht euch gegenseitig nicht mehr.'); break;
    case 'nav': return nav(+v);
    case 'beamer': document.body.classList.toggle('beamer'); fit(); break;
    case 'obnext': S.ob++; S.uc='ob'; break;
    case 'obcode': S.code='1234'; break;
    case 'obrole': S.obrole=v; break;
    case 'obcan': { const c=S.obcan; c.includes(v)?c.splice(c.indexOf(v),1):c.push(v); break; }
    case 'obfin': S.ob=4; S.screen='start'; toast('✓ Willkommen in der Lindenstraße! Du bist jetzt Stufe 2.'); break;
    case 'expand': S.uc='str'; S.karl='strasse'; toast('✓ Jetzt sichtbar für 23 Nachbarn in der Lindenstraße'); break;
    case 'karloffer': S.uc='str'; S.karl='angebot'; S.kchat=KCHAT(); S.screen='kchat'; break;
    case 'karlok': S.kchat.push({from:'karl',t:'Passt mir 👍'}); S.kchat.push({sys:1,t:'<b>Kennenlernen morgen um 17 Uhr</b> · Haustür Nr. 14'}); break;
  }
  render();
});

document.addEventListener('keydown', e => {
  if (e.target.id==='msg') { if (e.key==='Enter') document.querySelector('[data-act="send"]').click(); return; }
  if (e.key==='b' || e.key==='B') { document.body.classList.toggle('beamer'); fit(); render(); return; }
  const fwd = ['ArrowRight','ArrowDown','PageDown',' '].includes(e.key), back = ['ArrowLeft','ArrowUp','PageUp'].includes(e.key);
  if (!fwd && !back) return;
  e.preventDefault();
  nav(fwd?1:-1);
});
function nav(d){
  const flat = UC.flatMap(u=>u.steps.map((_,i)=>[u.id,i]));
  let k = flat.findIndex(([u,i])=>u===S.uc && i===S.cursor);
  if (k<0) { const u = UC.find(x=>x.id===S.uc), cur = u.steps.findIndex(x=>!x.done(S)); k = flat.findIndex(([a,i])=>a===S.uc && i===Math.max(0,cur)) - 1; }
  k = Math.max(0, Math.min(flat.length-1, k + d));
  gotoStep(...flat[k]);
}
function fit(){ const st=document.getElementById('stage'); if(!st) return; st.style.setProperty('--s', Math.max(0.35, Math.min((innerWidth-32)/(document.body.classList.contains('beamer')?1000:780), (innerHeight-24)/880, 1.35))); }
addEventListener('resize', fit); if (location.hash==='#beamer') document.body.classList.add('beamer'); fit();
const q = new URLSearchParams(location.search);
if (q.get('shot') && SHOTS[q.get('shot')]) { SHOTS[q.get('shot')](S); }
if (q.has('bare')) document.body.classList.add('bare');
document.querySelectorAll('.ctrlrow .cbtn').forEach(b=>b.innerHTML=X(b.innerHTML));
document.querySelector('[data-act="reset"]').addEventListener('click',()=>{S=fresh();render();},true);
render();
