name: web
on:
  pull_request:
  push:
    branches: [main]

# Läuft bewusst bei jedem PR (kein Pfadfilter): Ein als "required" eingetragener Check
# bliebe sonst bei reinen Doku-PRs auf "wartet" hängen.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
